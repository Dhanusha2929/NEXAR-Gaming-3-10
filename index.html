<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXAR Gaming</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="app.css">
</head>

<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">NEXAR</div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Tournaments</a></li>
            <li><a href="#">Teams</a></li>
            <li><a href="#">Store</a></li>
        </ul>
        <button class="btn">Join Now</button>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-text">
            <h1>ENTER THE NEXT LEVEL</h1>
            <p>Compete. Conquer. Become a legend in the ultimate gaming arena.</p>
            <button class="btn">Join Arena</button>
        </div>

        <div class="hero-image">
            <img src="/assets/main.jpg" alt="gamer">
        </div>
    </section>

    <!-- Games Section -->
    <section class="games">
        <h2>Featured Battles</h2>

        <div class="card-container">

            <div class="card">
                <img src="/assets/game1.jpg" alt="">
                <h3>Cyber War</h3>
                <p>Futuristic FPS Arena</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e" alt="">
                <h3>Shadow Ops</h3>
                <p>Stealth Battle Mode</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420" alt="">
                <h3>Neon Racing</h3>
                <p>High Speed Showdown</p>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer>
        © 2026 NEXAR Gaming. All Rights Reserved.
    </footer>

</body>
</html>
